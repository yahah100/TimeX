[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txai"
version = "0.1.0"
description = "TimeX: time-series explanations through model behavior consistency"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "axial-positional-embedding==0.2.1",
    "captum==0.5.0",
    "dtw-python==1.1.14",
    "einops==0.4.1",
    "ipdb==0.13.9",
    "lime==0.2.0.1",
    "local-attention==1.4.3",
    "matplotlib==3.5.1",
    "numpy==1.23.5",
    "nvidia-cublas-cu11==11.10.3.66",
    "nvidia-cuda-cupti-cu11==11.7.101",
    "nvidia-cuda-nvrtc-cu11==11.7.99",
    "nvidia-cuda-runtime-cu11==11.7.99",
    "nvidia-cudnn-cu11==8.5.0.96",
    "nvidia-cufft-cu11==10.9.0.58",
    "nvidia-curand-cu11==10.2.10.91",
    "nvidia-cusolver-cu11==11.4.0.1",
    "nvidia-cusparse-cu11==11.7.4.91",
    "nvidia-nccl-cu11==2.14.3",
    "nvidia-nvtx-cu11==11.7.91",
    "pandas==1.4.0",
    "reformer-pytorch==1.4.4",
    "scikit-learn==1.1.2",
    "scipy==1.9.1",
    "seaborn==0.11.2",
    "statsmodels==0.13.1",
    "symengine==0.9.2",
    "timesynth==0.2.4",
    "torch==2.0.0",
    "torchdiffeq==0.2.3",
    "torchvision==0.15.1",
    "tqdm==4.64.1",
    "tslearn==0.5.2",
    "umap-learn==0.5.3",
    "wfdb==4.0.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel==6.21.2",
    "ipython==8.10.0",
    "jupyter==1.0.0",
]

[dependency-groups]
dev = ["black==22.1.0"]

[tool.setuptools.packages.find]
include = ["txai*"]

[tool.uv]
default-groups = ["dev"]
override-dependencies = ["symengine==0.9.2"]
